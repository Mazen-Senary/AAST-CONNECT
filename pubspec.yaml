name: aast_connect
description: "AAST Connect - Student & Fresh Graduate Training Portal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.3.4

  # State management
  provider: ^6.1.1

  # Persistence
  shared_preferences: ^2.2.2

  # File handling
  file_picker: ^8.0.0
  image_picker: ^1.0.7

  # URL handling
  url_launcher: ^6.2.5

  # UI
  awesome_snackbar_content: ^0.1.2
  timelines_plus: ^1.0.7
  flutter_slidable: ^3.0.0
  lucide_icons: ^0.257.0

  # AI / Chatbot
  google_generative_ai: ^0.4.7

  # Config
  flutter_dotenv: ^6.0.1

  # Networking
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
